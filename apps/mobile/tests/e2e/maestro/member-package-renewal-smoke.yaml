appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 120000
- openLink: "fizyoflow://e2e-reset"
- openLink: "fizyoflow://e2e-login?email=member%40gmail.com&password=member123&redirect=%2F%28member%29%2Fpackage"
- extendedWaitUntil:
    visible: "Paket ve Geçmiş|Paketlerim|Diğer paketleri gör"
    timeout: 20000
- tapOn: "Diğer paketleri gör"
- assertVisible: "Paket seç"
- scrollUntilVisible:
    element:
      text: "Pakete ekle|Pakete Ekle"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Pakete ekle|Pakete Ekle"
