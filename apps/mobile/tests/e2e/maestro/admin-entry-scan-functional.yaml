appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 20000
- openLink: "fizyoflow://e2e-login?email=oguzhanuyar531%40gmail.com&password=admin123&redirect=%2F%28admin%29%2Fdashboard"
- scrollUntilVisible:
    element:
      id: "admin-dashboard-entry-scan"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 80
    centerElement: true
- tapOn:
    id: "admin-dashboard-entry-scan"
- extendedWaitUntil:
    visible:
      id: "admin-entry-scan-screen"
    timeout: 15000
- tapOn: "Manuel"
- tapOn:
    id: "admin-entry-scan-manual-code-input"
- inputText: "member@gmail.com"
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "admin-entry-scan-submit"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "admin-entry-scan-submit"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "admin-entry-scan-result"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- assertVisible: "Demo Member için salon girişi kaydedildi."
