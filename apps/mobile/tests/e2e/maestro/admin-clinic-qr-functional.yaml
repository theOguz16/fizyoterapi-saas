appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 30000
- openLink: "fizyoflow://e2e-reset"
- openLink: "fizyoflow://e2e-login?email=oguzhanuyar531%40gmail.com&password=admin123&redirect=%2F%28admin%29%2Fclinic-qr"
- extendedWaitUntil:
    visible:
      id: "admin-clinic-qr-screen"
    timeout: 20000
- assertVisible: "Salon QR kodu"
- extendedWaitUntil:
    visible:
      id: "admin-clinic-qr-preview"
    timeout: 20000
- scrollUntilVisible:
    element: "Salon kodu"
    direction: DOWN
    timeout: 10000
    centerElement: true
- assertVisible: "Salon kodu"
- scrollUntilVisible:
    element:
      id: "admin-clinic-qr-share-button"
    direction: DOWN
    timeout: 10000
    centerElement: true
- assertVisible: "Klinik bağlantısını paylaş|Salon bilgilerini tamamla"
# QR paylaşımı native Share ekranını açan gerçek işlemdir. Native başlık ve geri
# dönüş davranışı cihazdan cihaza değiştiği için bu akış paylaşımın açılmasına
# kadar olan ürünü doğrular; native geri dönüşü fiziksel cihaz paketinde ölçülür.
- tapOn:
    id: "admin-clinic-qr-share-button"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 3000
