appId: com.fizyoflow.mobile
name: auth-role-switch-logout-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- tapOn:
    id: "welcome-login-button"
- extendedWaitUntil:
    visible:
      id: "login-identity-input"
    timeout: 10000
- tapOn:
    id: "login-identity-input"
- inputText: "clinic.owner.e2e@demo.local"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "login-password-input"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "login-password-input"
- inputText: "clinic-owner123"
- runFlow: _submit-login.yaml
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "admin-dashboard-screen"
    timeout: 20000
- tapOn:
    id: "admin-tab-profile"
- extendedWaitUntil:
    visible:
      id: "admin-profile-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "role-switch-trainer"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "role-switch-trainer"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
- tapOn:
    id: "trainer-tab-profile"
- extendedWaitUntil:
    visible:
      id: "trainer-profile-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "trainer-profile-qr"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "trainer-profile-account-settings"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "trainer-profile-account-settings"
- scrollUntilVisible:
    element:
      id: "trainer-profile-logout"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "trainer-profile-logout"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 20000
