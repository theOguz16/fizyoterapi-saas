appId: com.fizyoflow.mobile
---
# Aktif üyenin aynı kliniğe gerçek ek paket başvurusu.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "fizyoflow://e2e-reset"
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- tapOn:
    id: "welcome-login-button"
- tapOn:
    id: "login-identity-input"
- inputText: "member@gmail.com"
- pressKey: ENTER
- tapOn:
    id: "login-password-input"
- inputText: "member123"
- runFlow: _submit-login.yaml
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "member-tab-profile"
    timeout: 20000
- tapOn:
    id: "member-tab-package"
- extendedWaitUntil:
    visible:
      id: "member-package-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "member-buy-additional-package-0"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "member-buy-additional-package-0"
- extendedWaitUntil:
    visible:
      id: "intake-package-detail-screen"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Duo partner bilgisi"
    commands:
      - scrollUntilVisible:
          element:
            id: "duo-partner-name-input"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "duo-partner-name-input"
      - inputText: "Aktif Uye Partner"
      - pressKey: ENTER
      - scrollUntilVisible:
          element:
            id: "duo-partner-contact-input"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "duo-partner-contact-input"
      - inputText: "active.partner@example.com"
      - pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "package-detail-continue"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "package-detail-continue"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "intake-time-selection-screen"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-0"
- extendedWaitUntil:
    visible: "Özete geç"
    timeout: 10000
- tapOn: "Özete geç"
- extendedWaitUntil:
    visible:
      id: "intake-booking-summary-screen"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: "intake-booking-summary-submit"
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 50
          centerElement: true
      - tapOn:
          id: "intake-booking-summary-submit"
- runFlow:
    when:
      platform: Android
    commands:
      - scroll
      - scroll
      - scroll
      - scroll
      - scroll
      - scroll
      - tapOn:
          text: "Onaya gönder"
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Başvurun alındı|Başvurun incelemeye alındı|Başvurun inceleniyor|Onay bekleniyor|Başvuru gönderildi|Paketlerim"
    timeout: 30000

# Gerçek rol koruması: eğitmen üye ekranına geçirilemez.
- openLink: "fizyoflow://e2e-reset"
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fhome"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
- openLink: "fizyoflow://(member)/package"
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 15000

# Gerçek admin kararı: oluşturulan ödeme/ek paket talebi reddedilir.
- openLink: "fizyoflow://e2e-reset"
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-login?email=oguzhanuyar531%40gmail.com&password=admin123&redirect=%2F%28admin%29%2Fapprovals"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "admin-approvals-screen"
    timeout: 20000
- scrollUntilVisible:
    element: "Detayı aç"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Detayı aç"
- scrollUntilVisible:
    element:
      id: "admin-approval-reject"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "admin-approval-reject"
- extendedWaitUntil:
    visible:
      id: "admin-approvals-screen"
    timeout: 20000

# Gerçek 401 yanıtının kullanıcı mesajına çevrilmesi.
- openLink: "fizyoflow://e2e-reset"
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- tapOn:
    id: "welcome-login-button"
- tapOn:
    id: "login-identity-input"
- inputText: "member@gmail.com"
- pressKey: ENTER
- tapOn:
    id: "login-password-input"
- inputText: "yanlis-sifre"
- runFlow:
    when:
      visible: "Kaydet"
    commands:
      - tapOn: "Sonra"
- runFlow:
    when:
      visible:
        id: "salon-qr-screen"
    commands:
      - tapOn:
          id: "app-shell-back-button"
- runFlow: _submit-login.yaml
- extendedWaitUntil:
    visible: "E-posta veya şifre hatalı."
    timeout: 15000
