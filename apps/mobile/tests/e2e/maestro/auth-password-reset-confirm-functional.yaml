appId: com.fizyoflow.mobile
name: auth-password-reset-confirm-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://reset-password?token=fizyoflow-e2e-password-reset-token-2026"
- extendedWaitUntil:
    visible:
      id: "password-reset-confirm-submit"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "password-reset-password-input"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "password-reset-password-toggle"
      - extendedWaitUntil:
          visible:
            id: "password-reset-password-input"
          timeout: 5000
- tapOn:
    id: "password-reset-password-input"
- inputText: "passwordnew123"
- waitForAnimationToEnd
- runFlow: _assert-valid-password.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: ENTER
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: "password-reset-repeat-input"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "password-reset-repeat-input"
- waitForAnimationToEnd
- inputText: "passwordnew123"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "password-reset-repeat-valid"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- scrollUntilVisible:
    element:
      id: "password-reset-confirm-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "password-reset-confirm-submit"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "password-reset-success"
    timeout: 15000
- tapOn:
    id: "password-reset-login"
- tapOn:
    id: "login-identity-input"
- inputText: "password.reset.e2e@demo.local"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "login-password-input"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "login-password-input"
- inputText: "passwordnew123"
- runFlow: _submit-login.yaml
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "admin-clinic-activation-step-1"
    timeout: 20000
