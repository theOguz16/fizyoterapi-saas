appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000

- openLink: "fizyoflow://e2e-reset"

- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fgroup-classes"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Grup dersleri"

- scrollUntilVisible:
    element:
      id: "trainer-group-classes-open-create"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "trainer-group-classes-open-create"
    retryTapIfNoChange: true

- scrollUntilVisible:
    element:
      id: "trainer-group-classes-name-input"
    direction: DOWN
    visibilityPercentage: 80
    timeout: 15000

- tapOn:
    id: "trainer-group-classes-name-input"

- eraseText: 50

- inputText: "E2E Aksam Pilates"

- pressKey: ENTER

- scrollUntilVisible:
    element:
      id: "trainer-group-classes-date-picker"
    direction: DOWN
    timeout: 10000

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "trainer-group-classes-date-picker"

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "trainer-group-classes-date-option-0"

- tapOn:
    id: "trainer-group-classes-time-picker"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "trainer-group-classes-time-option-0"

- scrollUntilVisible:
    element:
      id: "trainer-group-classes-submit"
    direction: DOWN
    speed: 80
    visibilityPercentage: 50
    timeout: 30000

- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "trainer-group-classes-submit"

- waitForAnimationToEnd:
    timeout: 6000

- assertVisible: "Grup dersi onaya gönderildi"

- scrollUntilVisible:
    element: "Aktif kayıtlar"
    direction: DOWN
    timeout: 10000
