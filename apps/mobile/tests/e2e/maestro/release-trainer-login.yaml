appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 15000
- tapOn:
    id: "welcome-login-button"
- tapOn:
    id: "login-identity-input"
- inputText: "elisauyar@gmail.com"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "login-password-input"
    direction: DOWN
- tapOn:
    id: "login-password-input"
    retryTapIfNoChange: true
- inputText: "trainer123"
- runFlow: _submit-login.yaml
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "trainer-home-qr-button"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 80
- assertVisible:
    id: "trainer-home-qr-button"
