appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- waitForAnimationToEnd:
    timeout: 2000
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fhome"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "trainer-home-qr-button"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 80
    centerElement: true
- tapOn:
    id: "trainer-home-qr-button"
- waitForAnimationToEnd
- assertVisible:
    id: "trainer-checkin-screen"
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fcheckin%3Fmode%3Dmanual%26backTo%3D%2F%28trainer%29%2Fhome"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "trainer-checkin-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "trainer-checkin-manual-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "trainer-checkin-manual-input"
- inputText: "MEM-DEMO001"
- pressKey: ENTER
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "trainer-checkin-result"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Durum: Başarılı"
- assertVisible: "Check-in tamamlandı. Paket hakkından 1 ders düşüldü."
