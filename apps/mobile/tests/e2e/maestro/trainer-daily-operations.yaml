appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000

- openLink: "fizyoflow://e2e-reset"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml

- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fhome"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml

- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
- assertVisible: "Bugünkü seanslar"

- scrollUntilVisible:
    element:
      id: "trainer-home-session-0-note"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "trainer-home-session-0"
- assertVisible:
    id: "trainer-home-session-0-checkin"
- assertVisible:
    id: "trainer-home-session-0-member"
- assertVisible:
    id: "trainer-home-session-0-note"

- tapOn:
    id: "trainer-home-session-0-note"
- extendedWaitUntil:
    visible: "Koç notları"
    timeout: 15000
- tapOn:
    id: "trainer-note-title-input"
- inputText: "E2E Seans Notu"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "trainer-note-body-input"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 80
    centerElement: true
- tapOn:
    id: "trainer-note-body-input"
- inputText: "Danisanin seans sonrasi takip notu."
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "trainer-note-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "trainer-note-submit"
- tapOn:
    id: "trainer-note-title-input"
- eraseText
- inputText: "E2E Seans Notu Guncel"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "trainer-note-body-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "trainer-note-body-input"
- eraseText
- inputText: "Danisanin guncellenmis E2E takip notu."
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "trainer-note-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "trainer-note-submit"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Danisanin guncellenmis E2E takip notu."
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true

- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fcalendar"
- extendedWaitUntil:
    visible:
      id: "trainer-calendar-screen"
    timeout: 20000
- tapOn:
    id: "trainer-calendar-day-with-events-1"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-selected-event-1"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "trainer-calendar-selected-event-1"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-open-reschedule"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "trainer-calendar-cancel-booking"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "trainer-calendar-open-reschedule"
- extendedWaitUntil:
    visible: "Alternatif saat otomatik seçilecek"
    timeout: 15000
- tapOn: "Öneriyi oluştur"
- extendedWaitUntil:
    visible: "Saat Onayı Bekliyor"
    timeout: 20000
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Frequest-center"
- extendedWaitUntil:
    visible:
      id: "trainer-request-center-screen"
    timeout: 20000
- assertVisible: "Durum: Bekliyor"
