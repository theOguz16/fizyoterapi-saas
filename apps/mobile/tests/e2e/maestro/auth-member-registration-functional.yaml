appId: com.fizyoflow.mobile
name: auth-member-registration-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://member-register?slug=demo-salon"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: _dismiss-ios-open-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "clinic-member-register-submit"
    timeout: 20000
- tapOn:
    id: "clinic-member-register-submit"
- scrollUntilVisible:
    element:
      id: "member-register-first-name-error"
    direction: DOWN
    timeout: 10000
- assertVisible: "Ad zorunludur."
- scrollUntilVisible:
    element:
      id: "member-register-first-name"
    direction: UP
    timeout: 10000
- tapOn:
    id: "member-register-first-name"
    point: "50%,50%"
    retryTapIfNoChange: true
- eraseText
- inputText: "Danisan"
- runFlow:
    when:
      notVisible: "Danisan"
    commands:
      - tapOn:
          id: "member-register-first-name"
          point: "50%,50%"
      - eraseText
      - inputText: "Danisan"
- extendedWaitUntil:
    visible: "Danisan"
    timeout: 5000
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "member-register-last-name"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "member-register-last-name"
- inputText: "Kayit"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "member-register-email"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "member-register-email"
- inputText: "member.registration.e2e@demo.local"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "member-register-phone"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "member-register-phone"
- inputText: "05550009988"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "member-register-password"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "member-register-password-toggle"
      - extendedWaitUntil:
          visible:
            id: "member-register-password"
          timeout: 5000
- tapOn:
    id: "member-register-password"
- inputText: "memberregister123"
- waitForAnimationToEnd
- runFlow: _assert-valid-password.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "member-register-password-toggle"
- scrollUntilVisible:
    element:
      id: "member-register-repeat"
    direction: DOWN
    centerElement: true
    timeout: 10000
- swipe:
    direction: UP
    duration: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "member-register-password-confirm-toggle"
      - extendedWaitUntil:
          visible:
            id: "member-register-repeat"
          timeout: 5000
- tapOn:
    id: "member-register-repeat"
- inputText: "memberregister123"
- waitForAnimationToEnd
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "legal-terms-checkbox"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "legal-terms-checkbox"
- tapOn:
    id: "legal-notice-checkbox"
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "clinic-member-register-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "clinic-member-register-submit"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "salon-detail-screen"
    timeout: 20000
