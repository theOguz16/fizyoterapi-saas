appId: com.fizyoflow.mobile
name: assert-valid-password-platform-helper
---
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "✓ En az 8 karakter"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - scrollUntilVisible:
          element: "✓ En az 8 karakter"
          direction: DOWN
          timeout: 10000
      - assertVisible: "✓ En az 8 karakter"
