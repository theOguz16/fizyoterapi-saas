appId: com.fizyoflow.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-login?email=member%40gmail.com&password=member123&redirect=%2F%28member%29%2Fprogress"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Aç"
    commands:
      - tapOn: "Aç"
- extendedWaitUntil:
    visible: "Gelişim"
    timeout: 20000
- scrollUntilVisible:
    element: "Dönem karşılaştırması"
    direction: DOWN
    timeout: 10000
- assertVisible: "Dönem karşılaştırması"
- scrollUntilVisible:
    element: "Paket kullanım özeti"
    direction: DOWN
    timeout: 10000
- assertVisible: "Paket kullanım özeti"
