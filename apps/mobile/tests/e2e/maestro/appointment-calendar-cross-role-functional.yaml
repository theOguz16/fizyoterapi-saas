appId: com.fizyoflow.mobile
name: appointment-calendar-cross-role-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 20000

# Danışan mevcut PT paketini yenilerken paket, eğitmen ve altı uygun saat seçer.
- openLink: "fizyoflow://e2e-login?email=member%40gmail.com&password=member123&redirect=%2F%28member%29%2Fpackage"
- extendedWaitUntil:
    visible:
      id: "member-package-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "member-renew-package-pt-bireysel-ders"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "member-renew-package-pt-bireysel-ders"
- extendedWaitUntil:
    visible:
      id: "intake-package-detail-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "package-detail-continue"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "package-detail-continue"
- extendedWaitUntil:
    visible:
      id: "intake-trainer-selection-screen"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: "intake-trainer-select-0"
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn:
          id: "intake-trainer-select-0"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Bu eğitmeni seç"
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn: "Bu eğitmeni seç"
- extendedWaitUntil:
    visible:
      id: "intake-time-selection-screen"
    timeout: 20000
# Gün adı tarihe göre değişebildiği için sabit Cuma/Cumartesi seçicisine
# bağlanma. Tüm günler listesindeki ilk üç slot ve sonraki günün ilk üç
# slotu, haftalık kuralı gerçek kullanıcı gibi farklı günlere dağıtır.
- scrollUntilVisible:
    element:
      id: "time-day-filter-all"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "time-day-filter-all"
- extendedWaitUntil:
    visible: "Tüm günler"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-0"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-0"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-1"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-1"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-2"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-2"
- extendedWaitUntil:
    visible: "3 saat daha seç"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-7"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-7"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-8"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-8"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "time-slot-toggle-0-9"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "time-slot-toggle-0-9"
- extendedWaitUntil:
    visible: "Özete geç"
    timeout: 10000
- tapOn:
    id: "time-selection-continue"
- extendedWaitUntil:
    visible:
      id: "intake-booking-summary-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Onaya gönder"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn: "Onaya gönder"
- extendedWaitUntil:
    visible:
      id: "intake-approval-pending-screen"
    timeout: 20000

# Yönetici yalnız ödeme/üyelik onayını verir; ders saati seçmez.
- openLink: "fizyoflow://e2e-login?email=oguzhanuyar531%40gmail.com&password=admin123&redirect=%2F%28admin%29%2Fapprovals"
- extendedWaitUntil:
    visible:
      id: "admin-approvals-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "admin-approval-open-payment"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "admin-approval-open-payment"
- extendedWaitUntil:
    visible:
      id: "admin-approval-detail-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "admin-approval-approve"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "admin-approval-approve"
- extendedWaitUntil:
    visible:
      id: "admin-approvals-screen"
    timeout: 20000

# Onaydan sonra otomatik oluşturulan ders eğitmen takviminde görünür.
# Altı tercih iki farklı güne dağıtılır; otomatik dersler de farklı günlerde oluşur.
# Bu tercihler manuel "Takvime ekle" talebi değildir. Otomatik planlamanın iki
# booking ürettiği API/DB doğrulayıcıda kanıtlanır.
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fcalendar"
- extendedWaitUntil:
    visible:
      id: "trainer-calendar-screen"
    timeout: 20000
- tapOn:
    id: "trainer-calendar-day-with-booking-0"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-selected-booking-event-0"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "trainer-calendar-selected-booking-event-0"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-open-reschedule"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "trainer-calendar-open-reschedule"
- extendedWaitUntil:
    visible: "Alternatif saat otomatik seçilecek"
    timeout: 10000
- tapOn: "Öneriyi oluştur"
- extendedWaitUntil:
    visible: "Saat Onayı Bekliyor"
    timeout: 15000

# Danışan öneriyi kabul eder; eğitmen kaynaklı değişiklikte paket hakkı korunur.
- openLink: "fizyoflow://e2e-login?email=member%40gmail.com&password=member123&redirect=%2F%28member%29%2Fhome"
- scrollUntilVisible:
    element:
      id: "member-schedule-change-approve-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 80
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "member-schedule-change-approve-0"
    timeout: 20000
- tapOn:
    id: "member-schedule-change-approve-0"
- extendedWaitUntil:
    notVisible:
      id: "member-schedule-change-request-0"
    timeout: 15000

# Aynı gerçek randevu için ikinci öneri oluşturulur ve bu kez danışan reddeder.
# Böylece iki karar yolu da yalnız API çağrısıyla değil üç rolün gerçek ekranlarıyla
# doğrulanır.
- openLink: "fizyoflow://e2e-login?email=elisauyar%40gmail.com&password=trainer123&redirect=%2F%28trainer%29%2Fcalendar"
- extendedWaitUntil:
    visible:
      id: "trainer-calendar-screen"
    timeout: 20000
- tapOn:
    id: "trainer-calendar-day-with-booking-0"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-selected-booking-event-0"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "trainer-calendar-selected-booking-event-0"
- scrollUntilVisible:
    element:
      id: "trainer-calendar-open-reschedule"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: "trainer-calendar-open-reschedule"
- extendedWaitUntil:
    visible: "Alternatif saat otomatik seçilecek"
    timeout: 10000
- tapOn: "Öneriyi oluştur"
- extendedWaitUntil:
    visible: "Saat Onayı Bekliyor"
    timeout: 15000
- openLink: "fizyoflow://e2e-login?email=member%40gmail.com&password=member123&redirect=%2F%28member%29%2Fhome"
- scrollUntilVisible:
    element:
      id: "member-schedule-change-reject-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 80
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "member-schedule-change-reject-0"
    timeout: 20000
- tapOn:
    id: "member-schedule-change-reject-0"
- extendedWaitUntil:
    notVisible:
      id: "member-schedule-change-request-0"
    timeout: 15000
