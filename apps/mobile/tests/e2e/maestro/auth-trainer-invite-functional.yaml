appId: com.fizyoflow.mobile
name: auth-trainer-invite-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://invite-accept?token=${INVITE_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "invite-accept-token"
    timeout: 10000
- extendedWaitUntil:
    visible: "Salon daveti bulundu."
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "invite-accept-first-name"
    direction: DOWN
    centerElement: true
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          direction: UP
          duration: 500
- tapOn:
    id: "invite-accept-first-name"
- inputText: "Egitmen"
- waitForAnimationToEnd
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "invite-accept-last-name"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "invite-accept-last-name"
- inputText: "Davet"
- waitForAnimationToEnd
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "invite-accept-phone"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "invite-accept-phone"
- inputText: "05550009977"
- waitForAnimationToEnd
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "invite-accept-password"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "trainer-invite-password-toggle"
      - extendedWaitUntil:
          visible:
            id: "invite-accept-password"
          timeout: 5000
- tapOn:
    id: "invite-accept-password"
- inputText: "trainerinvite123"
- waitForAnimationToEnd
- runFlow: _assert-valid-password.yaml
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "invite-accept-repeat-password"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "trainer-invite-password-confirm-toggle"
      - extendedWaitUntil:
          visible:
            id: "invite-accept-repeat-password"
          timeout: 5000
- tapOn:
    id: "invite-accept-repeat-password"
- inputText: "trainerinvite123"
- waitForAnimationToEnd
- pressKey: ENTER
- tapOn:
    id: "invite-accept-submit"
- scrollUntilVisible:
    element:
      id: "invite-accept-error"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "invite-accept-error"
- assertVisible: "Devam etmek için Kullanım Şartları'nı kabul etmelisin."
- scrollUntilVisible:
    element:
      id: "legal-terms-checkbox"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "legal-terms-checkbox"
- tapOn:
    id: "legal-notice-checkbox"
- tapOn:
    id: "invite-accept-submit"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "login-identity-input"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "login-identity-input"
    timeout: 10000
- tapOn:
    id: "login-identity-input"
- inputText: "trainer.registration.e2e@demo.local"
- pressKey: ENTER
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- scrollUntilVisible:
    element:
      id: "login-password-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "login-password-input"
- inputText: "trainerinvite123"
- runFlow: _submit-login.yaml
- runFlow:
    when:
      visible: "Sonra"
    commands:
      - tapOn: "Sonra"
- extendedWaitUntil:
    visible:
      id: "trainer-home-screen"
    timeout: 20000
