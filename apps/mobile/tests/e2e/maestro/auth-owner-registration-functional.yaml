appId: com.fizyoflow.mobile
name: auth-owner-registration-functional
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://e2e-reset"
- extendedWaitUntil:
    visible:
      id: "welcome-login-button"
    timeout: 60000
- openLink: "fizyoflow://register"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "register-first-name-input"
    direction: DOWN
    speed: 40
    visibilityPercentage: 60
    timeout: 30000
- tapOn:
    id: "register-first-name-input"
    point: "50%,50%"
    retryTapIfNoChange: true
- inputText: "Ali"
- runFlow:
    when:
      notVisible: "Ali"
    commands:
      - tapOn:
          id: "register-first-name-input"
          point: "50%,50%"
      - inputText: "Ali"
- extendedWaitUntil:
    visible: "Ali"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "register-last-name-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "register-last-name-input"
- inputText: "E2E"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "register-email-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "register-email-input"
- inputText: "owner.registration.e2e@demo.local"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "register-phone-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "register-phone-input"
- inputText: "05550009012"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "register-password-input"
    direction: DOWN
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "owner-register-password-toggle"
      - extendedWaitUntil:
          visible:
            id: "register-password-input"
          timeout: 5000
- tapOn:
    id: "register-password-input"
- inputText: "ownerregister123"
- waitForAnimationToEnd
- runFlow: _assert-valid-password.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "owner-register-password-toggle"
- scrollUntilVisible:
    element:
      id: "register-repeat-input"
    direction: DOWN
    centerElement: true
    timeout: 10000
- swipe:
    direction: UP
    duration: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "owner-register-password-confirm-toggle"
      - extendedWaitUntil:
          visible:
            id: "register-repeat-input"
          timeout: 5000
- tapOn:
    id: "register-repeat-input"
- inputText: "ownerregister123"
- waitForAnimationToEnd
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "legal-terms-checkbox-box"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: "legal-terms-checkbox-box"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "legal-notice-checkbox-box"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: "legal-notice-checkbox-box"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "register-submit-button"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "register-submit-button"
- extendedWaitUntil:
    visible:
      id: "admin-clinic-activation-step-1"
    timeout: 20000
